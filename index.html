<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPID 2026 Sentinel Station Clean Build</title>
<style>
:root{--bg:#04111f;--p:#081d31;--line:#285876;--c:#5de8ff;--g:#6cf3a3;--r:#ff657b;--t:#effbff;--m:#a9c9d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}button,input{font:inherit}#app{max-width:1250px;margin:auto;padding:16px}.card{background:#081d31;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px}.scene{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#061726}.scene img{width:100%;height:auto;display:block;pointer-events:none}.scan{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;border:4px solid var(--c);background:#06304ddd;color:white;font-weight:bold;cursor:pointer;box-shadow:0 0 0 12px #5de8ff22,0 0 45px #5de8ff;animation:p 1.2s infinite}@keyframes p{50%{box-shadow:0 0 0 28px #5de8ff08,0 0 65px #5de8ff}}.zone{position:absolute;z-index:11;border:3px solid var(--c);background:#5de8ff22;border-radius:18px;color:white;cursor:pointer}.zone span{background:#041827e8;border-radius:999px;padding:5px 8px}.zone.sel{border-color:var(--g);background:#6cf3a333}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button.sel{border-color:var(--g);background:#123d36}button{border:1px solid var(--line);background:#0b243b;color:white;padding:11px;border-radius:10px;cursor:pointer}button:hover{border-color:var(--c)}button.primary{background:linear-gradient(90deg,var(--c),var(--g));color:#03202b;font-weight:bold}.answers{display:grid;gap:8px}.correct{background:#123d36!important;border-color:var(--g)!important}.wrong{background:#472331!important;border-color:var(--r)!important}.msg{border-left:4px solid var(--c);padding:10px;background:#061827;border-radius:8px}.hidden{display:none!important}.locked{opacity:.35;pointer-events:none}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav span{padding:6px 8px;border:1px solid var(--line);border-radius:999px;color:var(--m)}.nav .on{color:white;border-color:var(--c)}.nav .done{color:var(--g)}.intro{text-align:center;max-width:700px;margin:35px auto}.intro input{width:100%;max-width:400px;padding:12px;background:#061827;color:white;border:1px solid var(--line);border-radius:10px}.feedback{margin-top:10px}.cert{text-align:center;border:2px solid var(--c);padding:30px;border-radius:18px}@media(max-width:650px){.actions{grid-template-columns:1fr}.scan{width:135px;height:135px}.zone{font-size:12px}}
</style>

<style id="separate-info-target-tabs">
.zone[data-zone="Patient"],.zone[data-zone="Linen"],.zone[data-zone="Pillow"],
.zone[data-zone="Bed"],.zone[data-zone="Bed rail"],.zone[data-zone="Meal tray"]{
 border-color:#ffc857!important;background:rgba(255,200,87,.13)!important;
}
.zone[data-zone="Patient"] span,.zone[data-zone="Linen"] span,.zone[data-zone="Pillow"] span,
.zone[data-zone="Bed"] span,.zone[data-zone="Bed rail"] span,.zone[data-zone="Meal tray"] span{
 border:1px solid #ffc857;background:#2a2415e8;
}
</style>

<style id="themed-finale">
.finale{position:relative;overflow:hidden;text-align:center;border:2px solid var(--c);background:radial-gradient(circle at 50% 0,#123e61 0,transparent 38%),linear-gradient(180deg,#081f36,#03101d);padding:34px 20px;border-radius:22px}
.finale:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#5de8ff0b 1px,transparent 1px),linear-gradient(90deg,#5de8ff0b 1px,transparent 1px);background-size:30px 30px;pointer-events:none}
.finale>*{position:relative}.future-ring{width:112px;height:112px;margin:0 auto 12px;border:3px solid var(--c);border-radius:50%;display:grid;place-items:center;font-size:55px;box-shadow:0 0 35px #5de8ff88}
.final-kicker{color:var(--g);font-weight:900;letter-spacing:.14em}.final-score{font-size:clamp(45px,8vw,76px);font-weight:900;color:var(--g);margin:8px 0}.final-sub{color:var(--m)}
.mission-report{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:800px;margin:20px auto}.mission-win{background:#071a2ddd;border:1px solid #2b5973;border-radius:13px;padding:12px}.mission-win b{color:var(--g)}
.heal-final{max-width:850px;margin:22px auto;padding:18px;border-left:5px solid var(--c);background:#061827;text-align:left;border-radius:12px;font-size:17px;line-height:1.55}
.final-quote{font-size:clamp(22px,4vw,38px);font-weight:900;margin:24px auto 10px;max-width:900px}.final-human{color:var(--c);font-weight:700;font-size:18px}.final-badge{display:inline-block;border:1px solid var(--g);border-radius:999px;padding:8px 13px;color:var(--g);margin:12px 4px}
@media(max-width:650px){.mission-report{grid-template-columns:1fr 1fr}.heal-final{font-size:15px}}
</style>
</head><body><div id="app"></div><script>
const S=[
['🚀','Pressure Injury','May the Force Be Off You',['Bedbound; limited mobility','Sacral redness','Prolonged pressure alert'],[
['What is the most appropriate immediate action?',['Apply topical antibiotics to the redness','Initiate a repositioning schedule','Increase room temperature','Encourage oral food and fluids'],1,'Offload pressure promptly. Repositioning should be individualised to relieve pressure and minimise shear.'],
['Which factor contributes most directly to pressure injury development?',['Malnutrition','Sustained shear and friction','Incontinence','Low oxygen levels','Sustained pressure and shear'],4,'Pressure injuries result primarily from sustained pressure, or pressure combined with shear.'],
['Which intervention is best practice for sacral pressure redistribution and PI prevention in an adult at risk?',['Use a pressure-redistributing mattress alone because it replaces repositioning','Reposition based on individualised assessment while using an appropriate pressure-redistributing support surface','Maintain semi-Fowler’s 45° for most of the day','Massage pressure points every shift'],1,'Support surfaces and repositioning work together. Repositioning is individualised according to clinical condition, pressure redistribution and tissue tolerance.']]],
['🛸','IAD','Predict & Prevent',['Frequent loose watery stool','Moist perineal skin','Barrier compromise predicted'],[
['What is the primary cause of IAD?',['Pressure over bony prominences','Exposure to urine and/or faeces disrupting the skin barrier and triggering inflammation','Allergy to absorbent products','Poor nutrition'],1,'IAD is irritant contact dermatitis associated with urine and/or faeces exposure, moisture, pH change and barrier disruption.'],
['Which is the best preventive strategy for reducing IAD risk?',['Cleanse with soap after every episode','Reposition every 1–2 hours','Gentle pH-appropriate cleansing after incontinence, consistent barrier protection, and escalation if damage worsens or fails to improve','Restrict fluids'],2,'Structured skin care combines prompt gentle cleansing, protection of the skin barrier and management of underlying incontinence.'],
['What most importantly differentiates IAD from a pressure injury?',['IAD is moisture/irritant related and often diffuse or irregular; PI corresponds to pressure and/or shear','IAD occurs only over bony prominences','IAD is always full thickness','IAD is painless while PI is always painful','They are the same'],0,'Aetiology is central: IAD is moisture-associated irritant dermatitis; PI is caused by pressure and/or shear. Both can coexist.'],
['Which best describes current best-practice management of IAD?',['Focus mainly on wound dressings','Structured skin care: cleansing, protection/restoration of barrier function and management of underlying incontinence','Reposition every 2 hours and use a mattress only','Expose to air and avoid barrier products'],1,'Management aims to gently remove irritants, protect and restore the barrier, reduce exposure and address incontinence; assess infection when indicated.']]],
['🤖','Mucosal Injury','AI Detects Hidden Damage',['78-year-old with NG tube','Increasing nasal discomfort','Redness at nostril'],[
['What potential issue should the nurse assess for?',['IAD','Mucosal membrane pressure injury related to the NG tube','Stage 1 sacral PI','Fungal lower-limb infection'],1,'An NG tube can exert pressure on nasal mucosa. Pain, redness, swelling, ulceration or bleeding warrant assessment.'],
['Which best describes a mucosal membrane pressure injury?',['A skin injury from prolonged device use','A pressure injury on a mucous membrane associated with a medical device','An adhesive-tape injury','A traumatic injury during insertion'],1,'MMPI occurs on mucous membranes when tissue is subjected to pressure from a device.'],
['Why are mucosal pressure injuries not conventionally staged?',['Mucosa is too fragile to assess','Conventional PI staging is based on skin anatomy, while mucosal anatomy differs','They are always superficial','They heal too quickly'],1,'Mucosal tissue does not have comparable anatomical layers for conventional skin PI staging.'],
['For patients at risk of device-related PI, what is the best preventive strategy?',['Secure firmly and never move it','Choose correct size/fit, inspect regularly, and reposition or relieve device pressure when clinically safe','Dress only after breakdown','Remove daily regardless of clinical need'],1,'Correct device selection, fit and securement, inspection, and clinically safe pressure relief are core preventive actions.']]],
['🦾','MDRPI','Humans + Machines',['Oxygen mask','Cervical collar','Pressure hotspots detected'],[
['MDRPIs are primarily caused by:',['Urine/faeces exposure','Pressure and/or shear from a medical device on skin or underlying tissue, often reflecting device shape','Poor nutrition','Device allergy'],1,'MDRPI is associated with pressure and/or shear from a device; the injury often corresponds to its shape or position.'],
['Which is the best preventive action?',['Secure the device tightly','Appropriate cushioning when indicated, regular skin inspection, and clinically safe repositioning/offloading','Apply a dressing only after breakdown','Remove every device each shift'],1,'Use correct application and fit, inspect beneath/around devices, offload when safe, and consider prophylactic dressings when appropriate.']]],
['🦸','Skin Tears','Fragile Skin, Strong Protection',['86-year-old with fragile skin','Needs transfer assistance','Long-term steroids','Small forearm skin flap'],[
['Which patient is at highest risk of a skin tear?',['Independent older adult with severe malnutrition','Older adult with eczema','Patient on long-term prophylactic antibiotic','Older adult with fragile skin, reduced mobility and assisted transfers'],3,'Age-related fragility plus impaired mobility and assisted transfers increases exposure to friction, shear and trauma.'],
['Which is the best skin-tear prevention strategy?',['Moisturise only if itchy','Use adhesive tape directly on fragile skin','Regular moisturising, adhesive-removal aids, safe transfer techniques and atraumatic/silicone products where possible','Restrict movement'],2,'Hydration, safe handling and atraumatic products reduce friction, shear and adhesive-related trauma.'],
['A skin tear has occurred. What is the most appropriate initial management?',['Remove viable flap and dry the wound','Cleanse, gently realign a viable flap and apply an appropriate non-traumatic dressing','Repeatedly apply antiseptic until dry','Use a tight local bandage for brisk bleeding'],1,'Control bleeding as needed, cleanse gently, preserve/re-align viable tissue and use an atraumatic dressing supporting moist wound healing.']]],
['🥗','Nutrition','Explore Innovation',['Poor oral intake','Low albumin reported','Delayed-healing risk'],[
['Which nutrient has the most important role in tissue repair among these options?',['Sodium','Protein','Sugar','Water'],1,'Protein is essential for tissue repair, collagen synthesis and immune function, alongside adequate energy, micronutrients and hydration.'],
['What is a likely long-term consequence of inadequate nutrition?',['No impact on skin integrity','Reduced infection risk','Increased muscle strength','Delayed healing, increased PI risk and reduced immune function'],3,'Sustained inadequate nutrition can impair repair, muscle mass, immune function and skin integrity.'],
['A patient with a pressure injury is at risk of malnutrition. Which intervention best promotes healing?',['Avoid high-calorie intake because bedbound patients need less energy','Apply collagen dressings more often','Provide adequate energy, protein and hydration, with nutritional supplementation when dietary intake is insufficient','Restrict fluid to prevent oedema'],2,'Nutrition care should address adequate energy, protein and hydration, with oral nutritional supplementation when needs cannot be met by normal intake.']]]];

const tasks=[
 {target:'Sacrum',zones:[['Sacrum',58,56,20,22],['Patient',35,25,18,22]],acts:['Reposition / turn patient','Apply topical antibiotic','Increase room temperature','Encourage oral intake only'],good:0,success:'Pressure offloaded. Question unlocked.'},
 {target:'Perineal skin',zones:[['Perineal skin',58,55,20,22],['Linen',30,65,22,16]],acts:['Gentle cleanse + barrier protection','Use harsh soap','Restrict oral fluids'],good:0,success:'Skin barrier protected. Question unlocked.'},
 {target:'Nasogastric (NG) tube',zones:[['Nasogastric (NG) tube',60,30,18,18],['Pillow',34,36,20,18]],acts:['Inspect and relieve device pressure','Secure tube more tightly','Wait for ulceration'],good:0,success:'Device pressure relieved. Question unlocked.'},

];
let st={name:'',scene:0,q:0,score:0,correct:0,stage:'scan',target:null,action:null,orders:{},sessionSeed:Date.now()+Math.random()};


function generateAllAnswerOrders(){
  st.orders={};
  for(let si=0;si<S.length;si++){
    for(let qi=0;qi<S[si][4].length;qi++){
      const key=si+'-'+qi;
      const q=S[si][4][qi];
      const a=q[1].map((_,i)=>i);
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      st.orders[key]=a;
    }
  }
}
function shuffledOrder(){
 const key=st.scene+'-'+st.q;
 const q=S[st.scene][4][st.q];
 if(!st.orders[key]){
   const a=q[1].map((_,i)=>i);
   for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
   st.orders[key]=a;
 }
 return st.orders[key];
}
function render(){
 const a=document.getElementById('app');
 if(st.stage==='intro'){a.innerHTML=`<div class="card intro"><h1>🌌 SKH Sentinel Station</h1><h2>Preventing Tomorrow’s Wounds Today</h2><p>Enter your name and begin the six wound-prevention missions.</p><p style="color:var(--m);font-size:13px">🔀 Answer choices are automatically reshuffled every time this HTML page is opened or refreshed.</p><input id=name placeholder="Player name / callsign"><p><button class=primary id=start>START MISSION</button></p></div>`;document.getElementById('start').onclick=()=>{st.name=document.getElementById('name').value.trim()||'Wound Prevention Specialist';st.stage='scan';render()};return}
 if(st.scene>=6){a.innerHTML=`<div class="finale">
 <div class="future-ring">⏳</div>
 <div class="final-kicker">FINAL SCENE · BACK TO THE FUTURE</div>
 <h1>What You Do Today Matters</h1>
 <p class="final-sub">H.E.A.L. has completed the final scan of the SKH Sentinel Station.</p>
 <div class="heal-final"><b style="color:var(--g)">H.E.A.L. FINAL MISSION REPORT</b><br><br>“Prediction is powerful. Prevention is transformative.”<br>Your interventions changed the patient timeline <b>before avoidable harm occurred.</b></div>
 <div class="mission-report">
   <div class="mission-win">🚀<br><b>Pressure Offloaded</b><br><span class="final-sub">PI risk controlled</span></div>
   <div class="mission-win">🛡️<br><b>Barrier Protected</b><br><span class="final-sub">IAD risk reduced</span></div>
   <div class="mission-win">🔍<br><b>Hidden Injury Detected</b><br><span class="final-sub">MMPI identified early</span></div>
   <div class="mission-win">🦾<br><b>Device Pressure Reduced</b><br><span class="final-sub">MDRPI prevented</span></div>
   <div class="mission-win">🩹<br><b>Fragile Skin Preserved</b><br><span class="final-sub">Skin tear managed safely</span></div>
   <div class="mission-win">🥗<br><b>Healing Supported</b><br><span class="final-sub">Nutrition optimised</span></div>
 </div>
 <div class="final-badge">🏆 WOUND PREVENTION SPECIALIST · ${st.name}</div>
 <div class="final-score">${st.correct} / 17</div>
 <div><b>MISSION SCORE</b></div>
 <p class="final-sub">Simulation points: ${st.score}</p>
 <div class="final-quote">“The future of wound care is not treatment—it's prevention.”</div>
 <p class="final-human">Advanced technology can predict risk, but human vigilance prevents harm.</p>
 <h2 style="color:var(--g);margin-top:26px">✓ TIMELINE CHANGED · MISSION COMPLETE</h2>
 <p class="final-sub">SPID 2026 · Preventing Tomorrow’s Wounds Today</p>
 <button class="primary" id="restart" style="margin-top:12px">↻ START A NEW MISSION</button>
 </div>`;document.getElementById('restart').onclick=()=>{st={name:'',scene:0,q:0,score:0,correct:0,stage:'intro',target:null,action:null,orders:{},sessionSeed:Date.now()+Math.random()};generateAllAnswerOrders();render()};return}
 const sc=S[st.scene], q=sc[4][st.q], t=tasks[st.scene];
 a.innerHTML=`<div class="card top"><div><b style="color:var(--c)">SPID 2026 · H.E.A.L.</b><h2>Scene ${st.scene+1}: ${sc[0]}</h2></div><div class=chip>⭐ ${st.score}</div></div><div class="card nav">${S.map((x,i)=>`<span class="${i<st.scene?'done':i===st.scene?'on':''}">${i<st.scene?'✓':'○'} ${x[0]}</span>`).join('')}</div>
 <div class=scene id=scene><img src="${IMAGES[st.scene]}" alt="Clinical scene ${st.scene+1}">${st.stage==='scan'?'<button class=scan id=scan>🔍<br>SCAN PATIENT<br><small>TAP TO START</small></button>':''}${st.stage!=='scan'?t.zones.map(z=>`<button class="zone ${st.target===z[0]?'sel':''}" data-zone="${z[0]}" style="left:${z[1]}%;top:${z[2]}%;width:${z[3]}%;height:${z[4]}%"><span>${z[0]}</span></button>`).join(''):''}</div>
 <div class="card ${st.stage==='scan'||st.target!==t.target?'hidden':''}" id="bedsidePanel"><h3>H.E.A.L. Bedside Assessment</h3><div class=msg id=msg>${message()}</div><div class="actions">${t.acts.map((x,i)=>`<button data-act=${i} class="${st.action===i?'sel':''}">${x}</button>`).join('')}</div><button id=apply style="margin-top:10px">⚡ PERFORM INTERVENTION</button></div>
 <div class="card ${st.stage!=='scan'&&st.target===infoZoneName()?'':'hidden'}" id="infoPanel"><h3>${infoPanelTitle()}</h3><div class=msg>${infoPanelContent()}</div></div>
 <div class="card ${st.stage!=='scan'&&st.target===null?'':'hidden'}" id="scanInstruction"><h3>🔍 Scan Complete</h3><div class=msg>${scanInstructionText()}</div></div>
 <div class="card ${st.stage==='quiz'?'':'locked'}" id=qbox><h3>Q${globalQ()}. ${q[0]}</h3><div class=answers>${shuffledOrder().map((orig,pos)=>`<button data-ans=${orig}><b>${String.fromCharCode(65+pos)}.</b> ${q[1][orig]}</button>`).join('')}</div><div id=fb class=feedback></div></div>`;
 bind();
}

function infoZoneName(){
 return ['Patient','Linen','Pillow','Bed','Bed rail','Meal tray'][st.scene];
}
function infoPanelTitle(){
 return ['👤 Patient Profile','🛏️ Linen / Moisture Clues','🛏️ Pillow / Device Clues','🛏️ Bed / Device Clues','⚠️ Environmental Risk Clues','🥗 Meal / Nutrition Clues'][st.scene];
}
function infoPanelContent(){
 const x=[
  '<b>Clinical clues</b><br>• Bedbound with limited mobility<br>• Redness over the sacrum<br>• Prolonged-pressure sensor alert<br><br><b>H.E.A.L.:</b> Review these clues, then select the specific pressure-risk area.',
  '<b>Clinical clues</b><br>• Frequent loose watery stool<br>• Moist perineal skin<br>• Repeated exposure to urine/faeces can disrupt the skin barrier<br><br><b>H.E.A.L.:</b> Now identify the skin area requiring moisture-barrier protection.',
  '<b>Clinical clues</b><br>• 78-year-old with NG tube in situ<br>• Increasing nasal discomfort and soreness<br>• Redness at the nostril where the tube is secured<br><br><b>H.E.A.L.:</b> Identify the mucosal device-contact site.',
  '<b>Clinical clues</b><br>• Oxygen mask and cervical collar in use<br>• Device-related pressure hotspots detected<br>• Skin beneath and around devices requires surveillance<br><br><b>H.E.A.L.:</b> Identify the device-contact area requiring offloading.',
  '<b>Clinical clues</b><br>• 86-year-old with fragile ageing skin<br>• Requires assistance with transfers<br>• Long-term steroid use<br>• Small forearm skin flap after transfer<br><br><b>H.E.A.L.:</b> Identify the injured fragile-skin area.',
  '<b>Clinical clues</b><br>• Poor oral intake<br>• Low albumin reported<br>• Delayed-healing risk<br><br><b>H.E.A.L.:</b> Identify the nutrition-risk status requiring intervention.'
 ];
 return x[st.scene];
}
function scanInstructionText(){
 const info=infoZoneName(),target=tasks[st.scene].target;
 return `Two hotspots are available. <b>${info}</b> opens clinical clues only. <b>${target}</b> opens the bedside assessment.`;
}
function message(){if(st.stage==='scan')return 'Tap the pulsing SCAN PATIENT button on the image.';if(!st.target)return 'Scan complete. Tap the relevant clinical target on the image.';if(st.action===null)return `Target selected: ${st.target}. Choose the immediate preventive action.`;return 'Press PERFORM INTERVENTION to submit your bedside action.'}
function bind(){
 let scan=document.getElementById('scan');if(scan)scan.onclick=()=>{st.stage='assess';render()};
 document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{
  const z=b.dataset.zone;
  if(z===infoZoneName()){st.target=z;st.action=null;render();return;}
  st.target=z;st.action=null;render();
});
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{st.action=+b.dataset.act;render()});
 let ap=document.getElementById('apply');if(ap)ap.onclick=apply;
 document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>answer(+b.dataset.ans,b));
}
function apply(){let t=tasks[st.scene];if(st.target!==t.target){document.getElementById('msg').textContent='H.E.A.L.: Reassess. Select the primary clinical risk area.';return}if(st.action!==t.good){document.getElementById('msg').textContent='H.E.A.L.: Reassess. That is not the immediate preventive action.';return}st.score+=150;st.stage='quiz';render()}
function answer(i,b){let q=S[st.scene][4][st.q],all=[...document.querySelectorAll('[data-ans]')];all.forEach(x=>x.disabled=true);let cb=all.find(x=>+x.dataset.ans===q[2]);if(cb)cb.classList.add('correct');let ok=i===q[2];if(!ok)b.classList.add('wrong');else{st.score+=100;if(globalQ()<=17)st.correct++}document.getElementById('fb').innerHTML=`<div class=msg><b>${ok?'✅ Correct':'❌ Not quite'}</b><br>${q[3]}</div><button class=primary id=next style="margin-top:10px">CONTINUE</button>`;document.getElementById('next').onclick=next}
function next(){let qs=S[st.scene][4];if(st.q<qs.length-1){st.q++;st.stage='quiz';render()}else{st.scene++;st.q=0;st.stage='scan';st.target=null;st.action=null;render()}}
function globalQ(){let n=1;for(let i=0;i<st.scene;i++)n+=S[i][4].length;return n+st.q}
st.stage='intro';generateAllAnswerOrders();render();
</script></body></html>
